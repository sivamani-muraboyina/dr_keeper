<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs><style>
    .title{font:700 28px Arial,sans-serif;fill:#16324f}.label{font:600 17px Arial,sans-serif;fill:#16324f}.small{font:14px Arial,sans-serif;fill:#334e68}.box{stroke:#486581;stroke-width:2;rx:14}.arrow{stroke:#486581;stroke-width:3;fill:none;marker-end:url(#m)}
  </style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#486581"/></marker></defs>
  <rect width="1200" height="700" fill="#f7fafc"/><text x="60" y="58" class="title">Secure EHR Insight: system architecture</text>
  <rect x="60" y="120" width="220" height="150" class="box" fill="#d9f0f0"/><text x="170" y="160" text-anchor="middle" class="label">Clinician</text><text x="170" y="193" text-anchor="middle" class="small">Select patient</text><text x="170" y="218" text-anchor="middle" class="small">Ask historical question</text>
  <rect x="360" y="100" width="250" height="190" class="box" fill="#e6f6ff"/><text x="485" y="140" text-anchor="middle" class="label">Streamlit UI</text><text x="485" y="175" text-anchor="middle" class="small">Chat and patient picker</text><text x="485" y="200" text-anchor="middle" class="small">Trace and disclaimer</text><text x="485" y="225" text-anchor="middle" class="small">HTTP client only</text>
  <rect x="700" y="75" width="400" height="270" class="box" fill="#fff3cd"/><text x="900" y="115" text-anchor="middle" class="label">FastAPI secure pipeline</text><text x="730" y="155" class="small">1. Redact question</text><text x="730" y="183" class="small">2. Guardrails</text><text x="730" y="211" class="small">3. Patient-scoped retrieval</text><text x="730" y="239" class="small">4. Redact context</text><text x="730" y="267" class="small">5. LLM or offline mock</text><text x="730" y="295" class="small">6. Redact answer and audit</text>
  <rect x="360" y="420" width="330" height="170" class="box" fill="#e8f5e9"/><text x="525" y="462" text-anchor="middle" class="label">Postgres + pgvector</text><text x="525" y="497" text-anchor="middle" class="small">Encounter rows and embeddings</text><text x="525" y="522" text-anchor="middle" class="small">Patient filter + cosine search</text><text x="525" y="547" text-anchor="middle" class="small">Audit log</text>
  <rect x="800" y="420" width="300" height="170" class="box" fill="#fce8e6"/><text x="950" y="462" text-anchor="middle" class="label">LLM provider</text><text x="950" y="497" text-anchor="middle" class="small">OpenAI-compatible API</text><text x="950" y="522" text-anchor="middle" class="small">Receives redacted context only</text><text x="950" y="547" text-anchor="middle" class="small">Or local mock mode</text>
  <path d="M280 195 H360" class="arrow"/><path d="M610 195 H700" class="arrow"/><path d="M850 345 V420" class="arrow"/><path d="M760 250 C700 300 650 380 590 420" class="arrow"/><path d="M1000 345 V420" class="arrow"/><path d="M800 505 H690" class="arrow"/>
</svg>