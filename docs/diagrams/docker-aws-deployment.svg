<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs><style>.title{font:700 28px Arial,sans-serif;fill:#16324f}.label{font:600 17px Arial,sans-serif;fill:#16324f}.small{font:14px Arial,sans-serif;fill:#334e68}.box{stroke:#486581;stroke-width:2;rx:14}.arrow{stroke:#486581;stroke-width:3;fill:none;marker-end:url(#m)}.note{font:italic 14px Arial,sans-serif;fill:#627d98}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#486581"/></marker></defs>
