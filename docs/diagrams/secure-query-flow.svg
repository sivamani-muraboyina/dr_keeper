<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900">
  <defs><style>.title{font:700 28px Arial,sans-serif;fill:#16324f}.label{font:600 17px Arial,sans-serif;fill:#16324f}.small{font:14px Arial,sans-serif;fill:#334e68}.box{stroke:#486581;stroke-width:2;rx:14}.arrow{stroke:#486581;stroke-width:3;fill:none;marker-end:url(#m)}.stop{stroke:#b42318;stroke-width:2;rx:14}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#486581"/></marker></defs>
  <rect width="1100" height="900" fill="#f7fafc"/><text x="55" y="55" class="title">Secure query flow</text>
  <rect x="385" y="90" width="330" height="70" class="box" fill="#d9f0f0"/><text x="550" y="122" text-anchor="middle" class="label">Question + selected patient</text><text x="550" y="145" text-anchor="middle" class="small">POST /api/v1/chat</text>
  <rect x="385" y="205" width="330" height="70" class="box" fill="#fff3cd"/><text x="550" y="237" text-anchor="middle" class="label">Redact the question</text><text x="550" y="260" text-anchor="middle" class="small">Never log or send raw identifiers</text>
  <rect x="385" y="320" width="330" height="75" class="box" fill="#fff3cd"/><text x="550" y="352" text-anchor="middle" class="label">Deterministic guardrails</text><text x="550" y="375" text-anchor="middle" class="small">Advice, identity, injection, scope</text>
  <rect x="60" y="320" width="240" height="75" class="stop" fill="#fce8e6"/><text x="180" y="352" text-anchor="middle" class="label">Blocked</text><text x="180" y="375" text-anchor="middle" class="small">Audit refusal; no retrieval or LLM</text>
  <rect x="385" y="455" width="330" height="75" class="box" fill="#e8f5e9"/><text x="550" y="487" text-anchor="middle" class="label">Embed and retrieve</text><text x="550" y="510" text-anchor="middle" class="small">WHERE subject_id = selected patient</text>
  <rect x="385" y="590" width="330" height="75" class="box" fill="#e8f5e9"/><text x="550" y="622" text-anchor="middle" class="label">Redact retrieved context</text><text x="550" y="645" text-anchor="middle" class="small">Preserve clinical facts where possible</text>
  <rect x="385" y="725" width="330" height="75" class="box" fill="#e6f6ff"/><text x="550" y="757" text-anchor="middle" class="label">Generate, redact, audit</text><text x="550" y="780" text-anchor="middle" class="small">Return answer, trace, disclaimer</text>
  <path d="M550 160 V205" class="arrow"/><path d="M550 275 V320" class="arrow"/><path d="M385 357 H300" class="arrow"/><path d="M550 395 V455" class="arrow"/><path d="M550 530 V590" class="arrow"/><path d="M550 665 V725" class="arrow"/>
</svg>