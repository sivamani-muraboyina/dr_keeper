<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs><style>.title{font:700 28px Arial,sans-serif;fill:#16324f}.label{font:600 17px Arial,sans-serif;fill:#16324f}.small{font:14px Arial,sans-serif;fill:#334e68}.box{stroke:#486581;stroke-width:2;rx:14}.arrow{stroke:#486581;stroke-width:3;fill:none;marker-end:url(#m)}.stop{stroke:#b42318;stroke-width:2;rx:14}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#486581"/></marker></defs>
  <rect width="1200" height="650" fill="#f7fafc"/><text x="55" y="55" class="title">Safety boundary: guardrails and redaction</text>
  <rect x="55" y="135" width="220" height="120" class="box" fill="#d9f0f0"/><text x="165" y="175" text-anchor="middle" class="label">User question</text><text x="165" y="205" text-anchor="middle" class="small">May contain identifiers</text><text x="165" y="228" text-anchor="middle" class="small">or unsafe intent</text>
  <rect x="345" y="115" width="250" height="160" class="box" fill="#fff3cd"/><text x="470" y="155" text-anchor="middle" class="label">Input protection</text><text x="470" y="185" text-anchor="middle" class="small">Presidio + custom patterns</text><text x="470" y="210" text-anchor="middle" class="small">Deterministic intent rules</text><text x="470" y="235" text-anchor="middle" class="small">Optional NeMo layer</text>
  <rect x="680" y="90" width="225" height="95" class="stop" fill="#fce8e6"/><text x="792" y="128" text-anchor="middle" class="label">Refuse and audit</text><text x="792" y="155" text-anchor="middle" class="small">LLM is never called</text>
  <rect x="680" y="225" width="225" height="95" class="box" fill="#e8f5e9"/><text x="792" y="263" text-anchor="middle" class="label">Retrieve safely</text><text x="792" y="290" text-anchor="middle" class="small">Selected patient only</text>
  <rect x="980" y="225" width="170" height="95" class="box" fill="#e6f6ff"/><text x="1065" y="263" text-anchor="middle" class="label">Redacted LLM</text><text x="1065" y="290" text-anchor="middle" class="small">Context only</text>
  <rect x="680" y="405" width="225" height="95" class="box" fill="#e6f6ff"/><text x="792" y="443" text-anchor="middle" class="label">Output protection</text><text x="792" y="470" text-anchor="middle" class="small">Redact generated answer</text>
  <rect x="980" y="405" width="170" height="95" class="box" fill="#e8f5e9"/><text x="1065" y="443" text-anchor="middle" class="label">Audit log</text><text x="1065" y="470" text-anchor="middle" class="small">No raw PHI</text>
  <path d="M275 195 H345" class="arrow"/><path d="M595 160 H680" class="arrow"/><path d="M595 230 C630 250 645 270 680 270" class="arrow"/><path d="M905 272 H980" class="arrow"/><path d="M1065 320 V405" class="arrow"/><path d="M905 452 H980" class="arrow"/>
</svg>